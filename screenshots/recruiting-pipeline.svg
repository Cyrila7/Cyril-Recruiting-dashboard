    <text x="1252" y="278" text-anchor="middle" fill="#8b949e" font-size="17">New jobs only</text>
    <text x="1252" y="308" text-anchor="middle" fill="#8b949e" font-size="17">Max 10 / cycle</text>

    <g stroke="#58a6ff" stroke-width="4" fill="none">
