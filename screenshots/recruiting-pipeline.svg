<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430">
  <rect width="1400" height="430" rx="28" fill="#0d1117"/>
  <text x="60" y="70" fill="#f0f6fc" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">How CyrilHQ Works</text>
  <text x="60" y="108" fill="#8b949e" font-family="Arial, Helvetica, sans-serif" font-size="20">A simple automated pipeline for discovering and delivering new job openings</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="55" y="155" width="235" height="180" rx="20" fill="#161b22" stroke="#30363d" stroke-width="2"/>
