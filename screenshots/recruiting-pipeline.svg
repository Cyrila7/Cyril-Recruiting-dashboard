    <text x="172" y="230" text-anchor="middle" fill="#58a6ff" font-size="19">Adzuna</text>
    <text x="172" y="265" text-anchor="middle" fill="#58a6ff" font-size="19">Greenhouse</text>
    <text x="172" y="300" text-anchor="middle" fill="#58a6ff" font-size="19">Ashby</text>

    <rect x="350" y="155" width="210" height="180" rx="20" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="455" y="210" text-anchor="middle" fill="#f0f6fc" font-size="21" font-weight="700">Scheduled Polling</text>
    <text x="455" y="250" text-anchor="middle" fill="#a5d6ff" font-size="19">Spring Boot</text>
    <text x="455" y="285" text-anchor="middle" fill="#8b949e" font-size="18">Every 15 minutes</text>

    <rect x="620" y="155" width="210" height="180" rx="20" fill="#161b22" stroke="#30363d" stroke-width="2"/>
