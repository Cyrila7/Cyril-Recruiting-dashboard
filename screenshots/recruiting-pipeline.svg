    <text x="725" y="282" text-anchor="middle" fill="#8b949e" font-size="17">Exclude senior roles</text>

    <rect x="890" y="155" width="210" height="180" rx="20" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="995" y="205" text-anchor="middle" fill="#f0f6fc" font-size="21" font-weight="700">Check &amp; Save</text>
    <text x="995" y="245" text-anchor="middle" fill="#a5d6ff" font-size="18">Track seen job IDs</text>
    <text x="995" y="277" text-anchor="middle" fill="#8b949e" font-size="17">Deduplicate</text>
    <text x="995" y="307" text-anchor="middle" fill="#8b949e" font-size="17">First-run guard</text>

    <rect x="1160" y="155" width="185" height="180" rx="20" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="1252" y="205" text-anchor="middle" fill="#f0f6fc" font-size="21" font-weight="700">Email Alert</text>
